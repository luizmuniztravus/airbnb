name: CI

# Roda em todo push (inclusive nos branches `worktree-*` das worktrees) e em
# todo PR para main. Como cada worktree nasce de origin/main e não enxerga as
# outras, a CI é o primeiro lugar onde o código de todas elas é verificado
# do mesmo jeito.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: Typecheck, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 é o piso declarado em `engines`; 24 é o que roda na máquina de
        # desenvolvimento. Os dois precisam passar.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` respeita o package-lock.json — é ele que mantém o baileys
      # travado no 6.7.24, apesar do `^` no package.json.
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A suíte usa `mock.module`, disponível a partir do Node 22.3 — por isso
      # roda nas duas versões da matriz, não só na de desenvolvimento.
      - name: Typecheck dos testes
        run: npm run typecheck:tests

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  segredos:
    name: Nada sensível versionado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # data/auth_info/ tem as credenciais da sessão do WhatsApp e .env tem o
      # WEBHOOK_SECRET. Como toda worktree recebe uma cópia local do .env no
      # setup, o risco de um `git add .` distraído levar isso junto é real.
      - name: Verificar que .env e data/ não entraram no repositório
        run: |
          vazou=$(git ls-files | grep -E '^(\.env$|\.env\.local$|data/)' || true)
          if [ -n "$vazou" ]; then
            echo "::error::Arquivos sensíveis versionados:"
            echo "$vazou"
            exit 1
          fi
          echo "OK — nenhum arquivo sensível versionado."

      - name: Verificar que o baileys segue no 6.7.24
        run: |
          versao=$(node -p "require('./package-lock.json').packages['node_modules/baileys'].version")
          echo "baileys no lockfile: $versao"
          if [ "$versao" != "6.7.24" ]; then
            echo "::error::baileys saiu do 6.7.24 (está em $versao). A 7.0.0-rc* tem quedas silenciosas de conexão — confirme que saiu uma estável antes de subir."
            exit 1
          fi
